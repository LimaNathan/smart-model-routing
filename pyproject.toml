[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-model-routing"
version = "0.1.0"
description = "Zero-dependency CLI installer, diagnostic doctor, and context-shielding benchmark for multi-agent Smart Model Routing across Antigravity, Claude Code, Codex CLI, and Cursor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Nathan Lima" }
]
keywords = [
  "ai-agents",
  "context-engineering",
  "model-routing",
  "antigravity",
  "claude-code",
  "codex",
  "cursor",
  "subagents",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.scripts]
smr = "bin.smr:main"

[tool.setuptools]
packages = ["bin"]
